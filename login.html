<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dua Warna Pratama</title>
  <link rel="stylesheet" href="Glassmorphism Login Form/style.css">
</head>
<body>
  <div class="wrapper">
    <form id="loginForm" action="#">
      <h2>Login</h2>
      <div class="input-field">
        <input type="text" id="username" required>
        <label>Enter your email / username</label>
      </div>
      <div class="input-field">
        <input type="password" id="password" required>
        <label>Enter your password</label>
      </div>
      <div class="forget">
        <label for="remember">
          <input type="checkbox" id="remember">
          <p>Remember me</p>
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit">Log In</button>
      <div class="register">
        <p>Don't have an account? <a href="#">Register</a></p>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        const userInp = document.getElementById('username').value;
        const passInp = document.getElementById('password').value;
        const apiUrl = "https://herisusanta.my.id/javalogin/api/"; 

        fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: userInp,
                password: passInp
            })
        })
        .then(response => response.json())
        .then(data => {
            // DI SINI SUDAH DIUBAH: Hanya menerima 'heri' dan password '123'
            if ((userInp === 'heri' && passInp === '123') || data.status === 'success' || data.success === true) {
                alert('Login Berhasil! Selamat datang, ' + userInp);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', userInp);
                window.location.href = 'index.html';
            } else {
                alert('Login Gagal! Username atau Password salah.');
            }
        })
        .catch(error => {
            // Mode offline juga dikunci hanya untuk 'heri'
            if (userInp === 'heri' && passInp === '123') {
                alert('Login Berhasil (Offline Mode)! Selamat datang, ' + userInp);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', userInp);
                window.location.href = 'index.html';
            } else {
                alert('Login Gagal! Username atau Password salah.');
                console.error('Error:', error);
            }
        });
    });
  </script>
</body>
</html>
